[package]
name = "lumina-compiler"
version = "0.1.0"
authors = ["Simon <simon.larsson-general@protonmail.com>"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
lumina-util = { path = "../lumina-util" }
lumina-parser = { path = "../lumina-parser" }
lumina-typesystem = { path = "../lumina-typesystem" }
rvsdg = { path = "../../rvsdg" }
target-lexicon = "0.13.3"
lumina-key = { path = "../lumina-key" }
derive-new = "0.7"
ibig = { version = "0.3.6", features = [], default-features = false }
owo-colors = { version = "4.2.3", features = ["supports-colors"] }
itertools = "0.14.0"
smallvec = "1.15.1"
derive_more = { version = "2.0.1", features = ["from", "display", "index", "index_mut", "deref", "deref_mut", "add", "add_assign"] }
insta = "1.43.2"
tracing = "0.1.41"
cranelift = "0.120.0"
cranelift-codegen = "0.120.0"
cranelift-module = "0.120.0"
cranelift-object = "0.120.0"
cranelift-native = "0.120.0"
tracing-subscriber = { version = "0.3.19", features = ["env-filter"] }
tracing-tree = "0.4.0"
# gimli = "*"
# object = "*"
num_cpus = "1.17.0"
rand = "0.9.2"
crossbeam = "0.8.4"
gimli = "0.32.3"
take_mut = "0.2.2"
either = "1.15.0"
serde = "1.0.228"
serde_json = "1.0.150"
